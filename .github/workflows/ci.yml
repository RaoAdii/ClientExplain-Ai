name: Foundation checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - name: Install and configure
        run: |
          npm ci
          python -m pip install -r services/api/requirements.lock
          python scripts/configure.py
          docker compose up -d --wait postgres redis
      - name: Migrate and seed development identity
        env:
          PYTHONPATH: services/api
        run: |
          alembic -c services/api/alembic.ini upgrade head
          python scripts/seed_dev.py
          alembic -c services/api/alembic.ini check
      - name: Backend checks
        run: |
          ruff check services scripts
          ruff format --check services scripts
          pytest -q --tb=short
      - name: Frontend checks
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Browser checks
        env:
          PYTHONPATH: services/api
        run: |
          npx playwright install --with-deps chromium
          uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/clientexplain-api.log 2>&1 &
          npm run start -w apps/web > /tmp/clientexplain-web.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/login >/dev/null && curl -fsS http://127.0.0.1:8000/api/v1/health/ready >/dev/null && break; sleep 2; done
          npm run test:e2e
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: apps/web/playwright-report
