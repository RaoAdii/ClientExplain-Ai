name: clientexplain
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: clientexplain
      POSTGRES_USER: clientexplain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.ps1 first}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientexplain -d clientexplain"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clientexplain:${POSTGRES_PASSWORD}@postgres:5432/clientexplain
      REDIS_URL: redis://redis:6379/0
      PRIVATE_STORAGE_ROOT: /var/lib/clientexplain/private-storage
      APP_ENV: ${APP_ENV:-development}
      AUTH_MODE: ${AUTH_MODE:-development}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      AI_EXTERNAL_PROCESSING_ALLOWED: ${AI_EXTERNAL_PROCESSING_ALLOWED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
    volumes: ["private_storage:/var/lib/clientexplain"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    profiles: [app]
  worker:
    build: &worker_build
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file: .env
    environment: &worker_environment
      DATABASE_URL: postgresql+psycopg://clientexplain:${POSTGRES_PASSWORD}@postgres:5432/clientexplain
      REDIS_URL: redis://redis:6379/0
      PRIVATE_STORAGE_ROOT: /var/lib/clientexplain/private-storage
      APP_ENV: ${APP_ENV:-development}
      AUTH_MODE: ${AUTH_MODE:-development}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      AI_EXTERNAL_PROCESSING_ALLOWED: ${AI_EXTERNAL_PROCESSING_ALLOWED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
    volumes: ["private_storage:/var/lib/clientexplain"]
    depends_on:
      job-watchdog: {condition: service_started}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A worker.celery_app:app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 15s
    profiles: [app]
  job-watchdog:
    build: *worker_build
    command: ["python", "-m", "worker.tasks.watchdog"]
    env_file: .env
    environment: *worker_environment
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    profiles: [app]
volumes:
  postgres_data:
  redis_data:
  private_storage:
